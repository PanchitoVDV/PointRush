# PointRush central settings (must be UTF-8).
# Team names, points and member UUIDs are stored in MongoDB.

# Hoofd-/lobbywereld: alleen spelers in deze wereld worden bij de start van een minigame-event
# opgepakt en naar de arena-spawn geteleporteerd (na afloop terug naar hun plek hier).
# Vul hier de exacte naam van je hub-/lobbywereld in. Standaard "world".
lobby-world: world

# Multi-server (Velocity) opstelling om events te isoleren op een aparte events-server.
# Staat standaard UIT: dan draait alles lokaal, precies zoals een losse server.
#
# Vereist op de proxy: Velocity met `bungee-plugin-message-channel = true` in velocity.toml
# (standaard aan). De servernamen hieronder moeten exact overeenkomen met je [servers] in velocity.toml.
# Beide servers draaien deze plugin en wijzen naar DEZELFDE mongodb.uri (gedeelde teams/punten).
network:
  enabled: false
  # Rol van DEZE server: "standalone" (los), "survival" (hoofdserver) of "events" (event-host).
  role: standalone
  # Servernaam van de event-host op de proxy.
  events-server: events
  # Servernaam van de hoofd-/survival-server op de proxy.
  survival-server: survival
  # Hoe spelers tussen servers verplaatst worden:
  #   leeg   = standaard BungeeCord/Velocity plugin-message (Connect <server>)
  #   anders = voer dit commando uit als de speler, met {server} als doelserver
  # Gebruik dit als je netwerk een eigen transfer-commando heeft (bv. "move {server}" i.p.v. /server).
  transfer-command: ""
  # Seconden die de events-host wacht na een event-aanvraag zodat spelers binnen zijn vóór de start.
  join-grace-seconds: 6
  # Seconden na afloop voordat spelers terug naar survival gestuurd worden (laat de eindscreen zien).
  return-delay-seconds: 6

# Ultimate UI profielmenu (/profile) — placeholders %pointrush_...%
profile:
  website-url: https://cloudito.cloud

# Ultimate UI overlay bij minigame-start (kopieer ui/pages/transition.yml naar UltimateUI/pages/)
minigame-transition:
  enabled: true
  page: transition
  auto-close: true
  # Exacte pluginnaam uit /plugins (leeg = automatisch zoeken)
  plugin-name: UltimateUI
  # Ultimate UI page id (name in transition.yml)
  # Gebruikt: UltimateUIAPI.get().openGui(players, page, hud=true, autoClose)

# Live Ultimate UI scorebord-HUD tijdens minigames (kopieer ui/pages/stats_display.yml naar UltimateUI/pages/)
minigame-hud:
  enabled: true
  page: stats_display
  # Hoe vaak (in ticks) de HUD herladen wordt zodat placeholders live updaten (300 = 1x per 15 seconden).
  # Zet op 0 als Ultimate UI placeholders zelf al ververst en je flikkering ziet.
  refresh-ticks: 300
  # Inhoud komt uit PlaceholderAPI-placeholders in stats_display.yml:
  #   %pointrush_hud_timer%      verstreken tijd (mm:ss)
  #   %pointrush_hud_score%      teampunten
  #   %pointrush_hud_players%    actieve spelers
  #   %pointrush_hud_rank%       team-ranking (#n)
  #   %pointrush_hud_event%      event-melding
  #   %pointrush_hud_objective%  naam van de actieve minigame

mongodb:
  uri: mongodb://localhost:27017
  database: pointrush
  teams-collection: teams
  # Per-speler collectible coins (Nexo IDs + totalen).
  player-coins-collection: player_coins
  # Event history voor de stats website (gesynchroniseerd vanuit events.yml).
  events-collection: events
  # Actieve streamer links voor de website (/live command).
  live-streams-collection: live_streams
  # Geplande random events + pool voor /randomevent en /event start.
  schedule-collection: event_schedule
  # Gedeeld "live event" doc voor cross-server orkestratie (network-modus).
  live-event-collection: live_event

cache:
  leaderboard-cache-enabled: true
  async-writes: true
  debounce-ms: 400

parkour:
  durationMinutes: 10

tnttag: {}

tntrun: {}

koth:
  pointSeconds: 60
  durationMinutes: 30
  spotRespawnSeconds: 45
  spots: {}

floorislava:
  lavaRiseSeconds: 60
  itemDropSeconds: 30

treasurehunt:
  hintIntervalSeconds: 120
  durationMinutes: 45
  claimRadius: 2.5
  treasures: {}

goldrush:
  durationMinutes: 60
  leaderboardIntervalSeconds: 300

hiddentarget:
  durationMinutes: 10
  killPoints: 1
  huntedPenalty: 1
  respawnSeconds: 60

ctf:
  roundMinutes: 5
  rounds: 2
  pointsPerCapture: 75
  deliveryRadius: 3.0

holdthecrown:
  pointSeconds: 60
  durationMinutes: 30
  pickupRadius: 3.0

bossevent:
  playersPerArena: 20
  arenaRounds: 3
  roundTimeoutMinutes: 15
  intermissionSeconds: 8
  survivorPoints: 100
  finalBonusPoints: 50
  finalConsolationPoints: 25
  arenas: {}
  final: {}

race: {}

boatrace:
  boatType: OAK

bingo:
  durationMinutes: 60
  material-pool: []

# Nexo collectible coins: spawn blokken (voetpositie). Spawning alleen tijdens actieve minigames.
coins:
  enabled: true
  # Periodieke check om lege spawnplekken te vullen (mits minigame loopt en pickup-cooldown voorbij).
  refill-interval-ticks: 160
  # Na pickup op een plek: pas daarna weer een coin (12000 ticks = 10 min bij 20 TPS).
  pickup-respawn-delay-ticks: 12000
  # Horizontaal/verticaal: geen tweede coin als hier al een PointRush-coin ligt.
  proximity-radius: 2.5
  # Nexo-item id's waaruit random gekozen wordt. Leeg laten = standaard Colorwave golden coins.
  pool: []
  # Voeg plaatsen toe met /coins addspawn ; genummerd zoals checkpoints.
  spawns: {}

# Shop: credits per Nexo-munt (hoger = meer waarde). Leeg {} = plugin-defaults (diamant/skull hoogst).
shop:
  coin-credits: {}
